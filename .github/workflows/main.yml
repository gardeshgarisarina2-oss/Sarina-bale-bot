name: Sarina Instagram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "* * * * *"

concurrency:
  group: sarina-bale-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run bot
        run: python main.py
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}