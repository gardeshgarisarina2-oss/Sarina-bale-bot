name: Test Bale Updates

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Get Bale Messages
        run: python test_updates.py
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}